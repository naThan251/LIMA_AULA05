
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Informática</title>
    <link rel="stylesheet" href="atividade03.css">
</head>
<body>

    <table>
        <caption>Estoque de Informática</caption>

        <thead>
            <tr>
                <th colspan="2">Informações do produto</th>
                <th colspan="2">Estoque</th>
            </tr>
            <tr>
                <th>Categoria</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Periféricos</th>
                <th>Mouse</th>
                <th>R$ 35,00</th>
                <th>10</th>
            </tr>
            <tr>
                <th class="baixo">Teclado</th>
                <th class="baixo">R$ 80,00</th>
                <th class="baixo">3</th>
            </tr>

            <tr>
                <th rowspan="2">Componentes</th>
                <th class="baixo">Memória RAM</th>
                <th class="baixo">R$ 150,00</th>
                <th class="baixo">4</th>
            </tr>
            <tr>
                <th>Placa de vídeo</th>
                <th>R$ 850,00</th>
                <th>6</th>
            </tr>

            <tr>
                <th rowspan="2">Armazenamento</th>
                <th>SSD 480 GB</th>
                <th>R$ 220,00</th>
                <th>8</th>
            </tr>
            <tr>
                <th class="baixo">HD 1 TB</th>
                <th class="baixo">R$ 280,00</th>
                <th class="baixo">2</th>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total de unidades em estoque</th>
                <th>33</th>
            </tr>
        </tfoot>
    </table>

</body>
</html>
