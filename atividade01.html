<!DOCTYPE html>
<html lang="ptbr">
<head>

    <title>Matérias Favoritas</title>

            width: 70px;
        }

        th {

        }        

        tbody th {

        .idade{text-align: center;}

        }

        tfoot {

            font-weight: bold;
            color: white;
            th { text-align: center; }
        }
    </style>
</head>
